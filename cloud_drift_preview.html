<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Cloud Drift Preview</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #111;
    color: #eee;
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
  }
  .info {
    padding: 12px 16px;
    font-size: 13px;
    line-height: 1.6;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
  }
  .info b { color: #ffd76b; }
  .stage {
    max-width: 900px;
    margin: 20px auto;
    border: 1px solid #333;
  }
  svg {
    display: block;
    width: 100%;
    height: auto;
    background: #000;
  }

  /* cloud_01: 主循環 30s, 飄一趟, X: -334px -> 930px, linear, 無 delay */
  #cloud_01 {
    animation: cloud1-drift 30s linear infinite;
  }
  @keyframes cloud1-drift {
    0%   { transform: translateX(-334px); }
    100% { transform: translateX(930px); }
  }

  /* cloud_02: 同速(30s), 用負 delay 讓它提前進場(相位錯開約 1/3), X: -960px -> 304px */
  #cloud_02 {
    animation: cloud2-drift 30s linear infinite;
    animation-delay: -10s;
  }
  @keyframes cloud2-drift {
    0%   { transform: translateX(-960px); }
    100% { transform: translateX(304px); }
  }
</style>
</head>
<body>

<div class="info">
  參數(v2,修正版):viewBox 1000×1000 · 主循環 <b>T = 30s</b> · 緩衝 <b>m = 25px</b> ·
  cloud_01、cloud_02 <b>同速</b>(各自 30s 飄完一趟)·
  cloud_02 用 <b>animation-delay: -10s</b> 相位錯開(提前約 1/3 進度進場),不再用手動插入跳點的方式。
  <br>
  觀察重點:整體節奏是否夠慢/夠 lofi、循環銜接處(每 30s 一次)還有沒有跳動或閃爍、兩朵雲會不會同時消失太久。
</div>
