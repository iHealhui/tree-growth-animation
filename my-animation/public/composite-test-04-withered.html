<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Composite Test - 04 Small Tree (Withered)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #111;
    color: #eee;
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
  }
  .info {
    padding: 12px 16px;
    font-size: 13px;
    line-height: 1.6;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
  }
  .info b { color: #ffd76b; }
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 10px 16px;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
    flex-wrap: wrap;
  }
  button {
    background: #2a2a2a;
    color: #eee;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #3a3a3a; }
  label { font-size: 13px; display: flex; align-items: center; gap: 6px; }

  .stage-wrap {
    display: flex;
    justify-content: center;
    padding: 20px;
  }
  .stage {
    position: relative;
    width: 700px;
    height: 700px;
    background:
      linear-gradient(45deg, #333 25%, transparent 25%),
      linear-gradient(-45deg, #333 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #333 75%),
      linear-gradient(-45deg, transparent 75%, #333 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    background-color: #222;
    border: 1px solid #444;
  }
  .layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

<div class="info">
  合成測試:<b>tree-growth 背景</b>(1000x1000, 30s/900f 循環,持續 loop)+ <b>04 small tree withered leaf-sway+fall</b>(1000x1000, 900f)疊在同一個畫布上。
  樹的動畫只完整播放一次(0-900f,含 4 片接力掉葉,15s 內掉完):播放到底之後不會回到 frame 0 重播,而是改成只循環<b>[450,900]</b>這段(存活的 4 片葉子持續搖曳),掉落的葉子永久消失,直到手動按「重整(模擬 reload)」或真的重新整理頁面才會回到滿葉狀態。棋盤格代表透明區域。
</div>

<div class="controls">
  <label><input type="checkbox" id="toggleBg" checked> 顯示背景</label>
  <label><input type="checkbox" id="toggleTree" checked> 顯示 04 small tree (withered)</label>
  <button id="restartBoth">重整(模擬 reload,葉子恢復)</button>
  <button id="playPause">暫停 / 播放</button>
  <span id="stateLabel" style="font-size:12px;color:#8f8;"></span>
</div>

<div class="stage-wrap">
  <div class="stage">
    <div id="bg-layer" class="layer"></div>
    <div id="tree-layer" class="layer"></div>
  </div>
</div>

<script>
  const STEADY_START = 450;
  const STEADY_END = 900;
  const stateLabel = document.getElementById('stateLabel');

  const bgAnim = lottie.loadAnimation({
    container: document.getElementById('bg-layer'),
    renderer: 'svg',
    loop: true,
    autoplay: true,
    path: '/projects/tree-growth/scene-1/lottie.json',
  });

  function loadTreeAnim() {
    const anim = lottie.loadAnimation({
      container: document.getElementById('tree-layer'),
      renderer: 'svg',
      loop: false,
      autoplay: true,
      path: '/_test_leaf_sway_withered.json',
    });
    stateLabel.textContent = '播放中:完整序列(葉子會依序掉落)';
    // Fires once, when the single full playthrough (0 -> 900) finishes. From
    // then on, loop ONLY the surviving leaves' sway segment forever -- never
    // go back to frame 0, so fallen leaves never come back on their own.
    anim.addEventListener('complete', () => {
      anim.setLoop(true);
      anim.playSegments([[STEADY_START, STEADY_END]], true);
      stateLabel.textContent = '已掉落 4 片葉子,永久保留(只循環存活葉片搖曳)';
    });
    return anim;
  }

  let treeAnim = loadTreeAnim();

  document.getElementById('toggleBg').addEventListener('change', (e) => {
    document.getElementById('bg-layer').style.visibility = e.target.checked ? 'visible' : 'hidden';
  });
  document.getElementById('toggleTree').addEventListener('change', (e) => {
    document.getElementById('tree-layer').style.visibility = e.target.checked ? 'visible' : 'hidden';
  });
  document.getElementById('restartBoth').addEventListener('click', () => {
    bgAnim.goToAndPlay(0, true);
    treeAnim.destroy();
    treeAnim = loadTreeAnim();
  });
  document.getElementById('playPause').addEventListener('click', () => {
    [bgAnim, treeAnim].forEach((a) => (a.isPaused ? a.play() : a.pause()));
  });
</script>

</body>
</html>
