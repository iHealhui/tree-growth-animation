<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>Export composite frames for any stage (for ffmpeg -> mp4)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<style>
  body { background:#111; color:#0f0; font-family: monospace; font-size: 13px; }
  #bgWrap, #treeWrap { position: absolute; left: -99999px; top: 0; }
  #composite { display: none; }
</style>
</head><body>
<pre id="log"></pre>
<div id="bgWrap"></div>
<div id="treeWrap"></div>
<canvas id="composite"></canvas>
<script>
  // Renders the background + tree composite for one stage and POSTs each frame
  // to scripts/frame-server.mjs under the `out` subfolder, for ffmpeg -> mp4.
  //
  //   _export_frames_stage.html?tree=/_test_seed.json&out=tree-01-healthy
  //
  // Query params:
  //   tree, out       required
  //   size            output px (default 1000 = the Lottie canvas, fallback quality)
  //   fps             output fps (default 30 = the source rate, so every source
  //                   frame is rendered and loop seams line up exactly)
  //   from            first tree frame (default 0)
  //   segment         loop the tree over [from, from+segment) instead of running
  //                   straight through -- for the withered stages' steady loop
  //   frames          source frames to render (default: tree's whole timeline,
  //                   or one 900f background cycle when `segment` is set)
  //   bgFrom          first background frame (default: `from` mod 900)
  // The background is always sampled modulo its own 900f loop.
  //
  // Withered stages (play once, then loop a steady segment) get two videos,
  // mirroring the Lottie playback rule: the full timeline (play once), then
  //   ?from=<steadyStart>&segment=<steadyEnd-steadyStart>&bgFrom=<totalFrames mod 900>&out=<key>-loop
  // which is one whole background cycle long, so it loops seamlessly AND starts
  // on exactly the background frame the play-once video ends on.
  //
  // Full recipe for the bundle's previews-mp4/<stage key>[-loop].mp4:
  //   1. node scripts/frame-server.mjs exports/frames-all   (port 3032)
  //   2. per video, open this page via the vite dev server and call
  //      window.runExport() (resolves when every frame is uploaded)
  //   3. per video: ffmpeg -framerate 30 -i exports/frames-all/<out>/frame-%04d.png
  //        -c:v libx264 -pix_fmt yuv420p -crf 20 -movflags +faststart previews-mp4/<out>.mp4
  //      (1000px frames are ~1MB each -- encode and delete each folder as you go)
  const log = (msg) => { document.getElementById('log').textContent += msg + "\n"; console.log(msg); };
  const params = new URLSearchParams(location.search);
  const TREE_PATH = params.get('tree');
  const OUT = params.get('out');
  if (!TREE_PATH || !OUT) throw new Error('need ?tree=<json path>&out=<subfolder>');
  const num = (k, d) => (params.has(k) ? Number(params.get(k)) : d);

  const FRAME_SERVER = 'http://localhost:3032';
  const OUTPUT_SIZE = num('size', 1000);
  const EXPORT_FPS = num('fps', 30);
  const SOURCE_FPS = 30;
  const BG_LOOP_FRAMES = 900; // background's own master loop length
  const STEP = SOURCE_FPS / EXPORT_FPS;
  const UPLOAD_BATCH = 8; // keep only a few full-size PNG data URLs in memory at once

  for (const id of ['bgWrap', 'treeWrap']) {
    document.getElementById(id).style.width = OUTPUT_SIZE + 'px';
    document.getElementById(id).style.height = OUTPUT_SIZE + 'px';
  }
  const compositeCanvas = document.getElementById('composite');
  compositeCanvas.width = OUTPUT_SIZE;
  compositeCanvas.height = OUTPUT_SIZE;
  const compositeCtx = compositeCanvas.getContext('2d');

  let bgReady = false, treeReady = false;
  const bgAnim = lottie.loadAnimation({
    container: document.getElementById('bgWrap'),
    renderer: 'canvas', loop: false, autoplay: false,
    path: '/projects/tree-growth/scene-1/lottie.json',
    rendererSettings: { clearCanvas: true, preserveAspectRatio: 'xMidYMid meet' },
  });
  const treeAnim = lottie.loadAnimation({
    container: document.getElementById('treeWrap'),
    renderer: 'canvas', loop: false, autoplay: false,
    path: TREE_PATH,
    rendererSettings: { clearCanvas: true, preserveAspectRatio: 'xMidYMid meet' },
  });

  bgAnim.addEventListener('DOMLoaded', () => { bgReady = true; log('bg data_ready'); maybeReady(); });
  treeAnim.addEventListener('DOMLoaded', () => { treeReady = true; log('tree data_ready: ' + TREE_PATH); maybeReady(); });
  bgAnim.addEventListener('data_failed', () => log('bg data_failed'));
  treeAnim.addEventListener('data_failed', () => log('tree data_failed'));

  window.exportStatus = 'loading';
  function maybeReady() {
    if (bgReady && treeReady) {
      log('both ready. Call window.runExport() to start.');
      window.exportStatus = 'ready';
    }
  }

  window.runExport = async function () {
    const bgCanvasEl = document.querySelector('#bgWrap canvas');
    const treeCanvasEl = document.querySelector('#treeWrap canvas');
    const treeTotalFrames = treeAnim.totalFrames;
    const from = num('from', 0);
    const segment = num('segment', 0);
    const sourceFrames = num('frames', segment ? BG_LOOP_FRAMES : treeTotalFrames - from);
    const bgFrom = num('bgFrom', from % BG_LOOP_FRAMES);
    window.exportStatus = 'capturing';

    const outputFrameCount = Math.round((sourceFrames / SOURCE_FPS) * EXPORT_FPS);
    let posts = [];
    for (let i = 0; i < outputFrameCount; i++) {
      const f = i * STEP; // source frames since the start of this video
      const treeFrame = segment ? from + (f % segment) : Math.min(treeTotalFrames - 0.001, from + f);
      bgAnim.goToAndStop((bgFrom + f) % BG_LOOP_FRAMES, true);
      treeAnim.goToAndStop(treeFrame, true);
      compositeCtx.clearRect(0, 0, OUTPUT_SIZE, OUTPUT_SIZE);
      compositeCtx.drawImage(bgCanvasEl, 0, 0, OUTPUT_SIZE, OUTPUT_SIZE);
      compositeCtx.drawImage(treeCanvasEl, 0, 0, OUTPUT_SIZE, OUTPUT_SIZE);
      const name = OUT + '/frame-' + String(i).padStart(4, '0') + '.png';
      posts.push(fetch(FRAME_SERVER + '/frame/' + name, { method: 'POST', body: compositeCanvas.toDataURL('image/png') }));
      if (posts.length >= UPLOAD_BATCH) { await Promise.all(posts); posts = []; }
      window.exportProgress = i + 1;
    }
    await Promise.all(posts);
    window.exportStatus = 'done';
    return OUT + ': ' + outputFrameCount + ' frames at ' + OUTPUT_SIZE + 'px ' + EXPORT_FPS + 'fps';
  };
</script>
</body></html>
