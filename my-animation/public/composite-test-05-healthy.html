<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Composite Test - 05 Mature Tree Healthy</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #111; color: #eee; font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif; }
  .info { padding: 12px 16px; font-size: 13px; line-height: 1.6; background: #1a1a1a; border-bottom: 1px solid #333; }
  .info b { color: #ffd76b; }
  .controls { display: flex; gap: 10px; align-items: center; padding: 10px 16px; background: #1a1a1a; border-bottom: 1px solid #333; flex-wrap: wrap; }
  button { background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 4px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  button:hover { background: #3a3a3a; }
  label { font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .stage-wrap { display: flex; justify-content: center; padding: 20px; }
  .stage {
    position: relative; width: 700px; height: 700px;
    background: linear-gradient(45deg, #333 25%, transparent 25%), linear-gradient(-45deg, #333 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #333 75%), linear-gradient(-45deg, transparent 75%, #333 75%);
    background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    background-color: #222; border: 1px solid #444;
  }
  .layer { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>

<div class="info">
  合成測試:<b>tree-growth 背景</b>(1000x1000, 30s/900f 循環)+ <b>05 mature tree healthy leaf-sway</b>(1000x1000, 同樣 30s/900f 循環)疊在同一個畫布上。棋盤格代表透明區域。
</div>

<div class="controls">
  <label><input type="checkbox" id="toggleBg" checked> 顯示背景</label>
  <label><input type="checkbox" id="toggleTree" checked> 顯示 05 mature tree (healthy)</label>
  <button id="restartBoth">同步重播兩者</button>
  <button id="playPause">暫停 / 播放</button>
</div>

<div class="stage-wrap">
  <div class="stage">
    <div id="bg-layer" class="layer"></div>
    <div id="tree-layer" class="layer"></div>
  </div>
</div>

<script>
  const bgAnim = lottie.loadAnimation({
    container: document.getElementById('bg-layer'),
    renderer: 'svg', loop: true, autoplay: true,
    path: '/projects/tree-growth/scene-1/lottie.json',
  });

  const treeAnim = lottie.loadAnimation({
    container: document.getElementById('tree-layer'),
    renderer: 'svg', loop: true, autoplay: true,
    path: '/_test_leaf_sway_tree05_healthy.json',
  });

  document.getElementById('toggleBg').addEventListener('change', (e) => {
    document.getElementById('bg-layer').style.visibility = e.target.checked ? 'visible' : 'hidden';
  });
  document.getElementById('toggleTree').addEventListener('change', (e) => {
    document.getElementById('tree-layer').style.visibility = e.target.checked ? 'visible' : 'hidden';
  });
  document.getElementById('restartBoth').addEventListener('click', () => {
    bgAnim.goToAndPlay(0, true);
    treeAnim.goToAndPlay(0, true);
  });
  document.getElementById('playPause').addEventListener('click', () => {
    [bgAnim, treeAnim].forEach((a) => (a.isPaused ? a.play() : a.pause()));
  });
</script>

</body>
</html>
