<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Composite Test</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #111;
    color: #eee;
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
  }
  .info {
    padding: 12px 16px;
    font-size: 13px;
    line-height: 1.6;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
  }
  .info b { color: #ffd76b; }
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 10px 16px;
    background: #1a1a1a;
    border-bottom: 1px solid #333;
    flex-wrap: wrap;
  }
  button {
    background: #2a2a2a;
    color: #eee;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #3a3a3a; }
  label { font-size: 13px; display: flex; align-items: center; gap: 6px; }

  .stage-wrap {
    display: flex;
    justify-content: center;
    padding: 20px;
  }
  .stage {
    position: relative;
    width: 700px;
    height: 700px;
    background:
      linear-gradient(45deg, #333 25%, transparent 25%),
      linear-gradient(-45deg, #333 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #333 75%),
      linear-gradient(-45deg, transparent 75%, #333 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    background-color: #222;
    border: 1px solid #444;
  }
  .layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>

<div class="info">
  合成測試:<b>tree-growth 背景</b>(1000x1000, 30s 循環)+ <b>tree_fg_01_sprout</b>(1000x1000, 單次播放約 2.7s)疊在同一個畫布上。
  棋盤格代表透明區域,用來檢查前景動畫的透明背景有沒有正確去背。
</div>

<div class="controls">
  <label><input type="checkbox" id="toggleBg" checked> 顯示背景</label>
  <label><input type="checkbox" id="toggleSprout" checked> 顯示 sprout</label>
  <button id="replaySprout">重播 sprout</button>
  <label><input type="checkbox" id="loopSprout"> sprout 循環播放</label>
  <button id="playPause">暫停 / 播放</button>
</div>

<div class="stage-wrap">
  <div class="stage">
    <div id="bg-layer" class="layer"></div>
    <div id="sprout-layer" class="layer"></div>
  </div>
</div>

<script>
  const bgAnim = lottie.loadAnimation({
    container: document.getElementById('bg-layer'),
    renderer: 'svg',
    loop: true,
    autoplay: true,
    path: '/projects/tree-growth/scene-1/lottie.json',
  });

  const sproutAnim = lottie.loadAnimation({
    container: document.getElementById('sprout-layer'),
    renderer: 'svg',
    loop: false,
    autoplay: true,
    path: '/tree_fg_01_sprout.json',
  });

  document.getElementById('toggleBg').addEventListener('change', (e) => {
    document.getElementById('bg-layer').style.visibility = e.target.checked ? 'visible' : 'hidden';
  });
  document.getElementById('toggleSprout').addEventListener('change', (e) => {
    document.getElementById('sprout-layer').style.visibility = e.target.checked ? 'visible' : 'hidden';
  });
  document.getElementById('replaySprout').addEventListener('click', () => {
    sproutAnim.goToAndPlay(0, true);
  });
  document.getElementById('loopSprout').addEventListener('change', (e) => {
    sproutAnim.loop = e.target.checked;
    sproutAnim.goToAndPlay(0, true);
  });
  document.getElementById('playPause').addEventListener('click', () => {
    [bgAnim, sproutAnim].forEach((a) => (a.isPaused ? a.play() : a.pause()));
  });
</script>

</body>
</html>
