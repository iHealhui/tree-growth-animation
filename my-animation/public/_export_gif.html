<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>Export composite GIF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
<style>
  body { background:#111; color:#0f0; font-family: monospace; font-size: 13px; }
  #bgWrap, #treeWrap { position: absolute; left: -99999px; top: 0; }
</style>
</head><body>
<pre id="log"></pre>
<div id="bgWrap"></div>
<div id="treeWrap"></div>
<canvas id="composite"></canvas>
<script>
  const log = (msg) => { document.getElementById('log').textContent += msg + "\n"; console.log(msg); };

  const OUTPUT_SIZE = 480;      // px, output GIF is square (source viewBox 1000x1000)
  const EXPORT_FPS = 15;        // gif frame rate
  const SOURCE_FPS = 30;
  const SOURCE_TOTAL_FRAMES = 900; // 30s master loop
  const STEP = SOURCE_FPS / EXPORT_FPS; // sample every Nth source frame
  const DELAY_MS = Math.round(1000 / EXPORT_FPS);

  document.getElementById('bgWrap').style.width = OUTPUT_SIZE + 'px';
  document.getElementById('bgWrap').style.height = OUTPUT_SIZE + 'px';
  document.getElementById('treeWrap').style.width = OUTPUT_SIZE + 'px';
  document.getElementById('treeWrap').style.height = OUTPUT_SIZE + 'px';

  const compositeCanvas = document.getElementById('composite');
  compositeCanvas.width = OUTPUT_SIZE;
  compositeCanvas.height = OUTPUT_SIZE;
  const compositeCtx = compositeCanvas.getContext('2d');

  let bgReady = false, treeReady = false;

  const bgAnim = lottie.loadAnimation({
    container: document.getElementById('bgWrap'),
    renderer: 'canvas',
    loop: false,
    autoplay: false,
    path: '/projects/tree-growth/scene-1/lottie.json',
    rendererSettings: { clearCanvas: true, preserveAspectRatio: 'xMidYMid meet' },
  });
  const treeAnim = lottie.loadAnimation({
    container: document.getElementById('treeWrap'),
    renderer: 'canvas',
    loop: false,
    autoplay: false,
    path: '/_test_leaf_sway_full.json',
    rendererSettings: { clearCanvas: true, preserveAspectRatio: 'xMidYMid meet' },
  });

  bgAnim.addEventListener('DOMLoaded', () => { bgReady = true; log('bg data_ready'); maybeStart(); });
  treeAnim.addEventListener('DOMLoaded', () => { treeReady = true; log('tree data_ready'); maybeStart(); });
  bgAnim.addEventListener('data_failed', () => log('bg data_failed'));
  treeAnim.addEventListener('data_failed', () => log('tree data_failed'));

  window.exportStatus = 'loading';
  window.exportProgress = 0;

  function maybeStart() {
    if (bgReady && treeReady) {
      log('both ready. Call window.runCapture() from devtools/automation to start ' +
          '(synchronous loop -- avoids background-tab setTimeout throttling).');
      window.exportStatus = 'ready';
    }
  }

  window.runCapture = function () {
    const bgCanvasEl = document.querySelector('#bgWrap canvas');
    const treeCanvasEl = document.querySelector('#treeWrap canvas');
    const gif = new GIF({
      workers: 4,
      quality: 10,
      width: OUTPUT_SIZE,
      height: OUTPUT_SIZE,
      workerScript: '/_gif.worker.js',
    });

    window.exportStatus = 'capturing';
    for (let frame = 0; frame < SOURCE_TOTAL_FRAMES; frame += STEP) {
      bgAnim.goToAndStop(frame, true);
      treeAnim.goToAndStop(frame, true);
      compositeCtx.clearRect(0, 0, OUTPUT_SIZE, OUTPUT_SIZE);
      compositeCtx.drawImage(bgCanvasEl, 0, 0, OUTPUT_SIZE, OUTPUT_SIZE);
      compositeCtx.drawImage(treeCanvasEl, 0, 0, OUTPUT_SIZE, OUTPUT_SIZE);
      gif.addFrame(compositeCtx, { copy: true, delay: DELAY_MS });
      window.exportProgress = Math.round((frame / SOURCE_TOTAL_FRAMES) * 100);
    }
    log('all frames captured, rendering gif...');
    window.exportStatus = 'rendering';

    gif.on('progress', (p) => {
      window.exportRenderProgress = Math.round(p * 100);
    });
    gif.on('finished', (blob) => {
      log('gif finished, size=' + blob.size + ' bytes');
      window.exportStatus = 'done';
      window.exportBlobSize = blob.size;
      const url = URL.createObjectURL(blob);
      window.exportBlobUrl = url;
      const a = document.createElement('a');
      a.href = url;
      a.download = 'tree-composite-04.gif';
      document.body.appendChild(a);
      a.click();
      log('download triggered: tree-composite-04.gif');
    });
    gif.render();
    return 'capture loop finished synchronously, rendering in workers now';
  };
</script>
</body></html>
